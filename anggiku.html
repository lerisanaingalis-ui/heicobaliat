<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Anggi ❤️</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    text-align:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

h1{
    margin-top:120px;
    font-size:40px;
    color:white;
    z-index:2;
    position:relative;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:20px;
}

#yes{
    background:#ff4d6d;
    color:white;
    transition:0.3s;
    z-index:2;
    position:relative;
}

#no{
    background:#333;
    color:white;
    position:absolute;
}

.heart{
    position:fixed;
    top:-10px;
    color:red;
    font-size:20px;
    animation: fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<h1>Anggi Da Silva, mau ga jadi pacarku? ❤️</h1>

<button id="yes" onclick="yesClick()">Ya ❤️</button>
<button id="no">Tidak 😢</button>

<!-- Lagu Ed Sheeran - Perfect -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/2Vv-BfVoq4g?autoplay=1&loop=1&playlist=2Vv-BfVoq4g"
frameborder="0"
allow="autoplay">
</iframe>

<script>

let yesSize = 1;
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton(){

    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    yesSize += 0.25;
    yesBtn.style.transform = "scale(" + yesSize + ")";
}

function yesClick(){
    document.body.innerHTML =
    "<h1 style='color:white;margin-top:200px;font-size:50px;'>Yeeey ❤️ Anggi sekarang jadi pacarku!</h1>";
}

/* animasi hati jatuh */

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (Math.random()*3+3) + "s";
    heart.style.fontSize = (Math.random()*20+10) + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}

setInterval(createHeart,200);

</script>

</body>
</html>
