<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Anggi ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    overflow:hidden;
}

h1{
    margin-top:120px;
    font-size:40px;
    color:white;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:20px;
}

#yes{
    background:#ff4d6d;
    color:white;
    transition:0.3s;
}

#no{
    background:#444;
    color:white;
    position:absolute;
}

</style>
</head>

<body>

<h1>Anggi Da Silva, mau ga jadi pacarku? ❤️</h1>

<button id="yes" onclick="yesClick()">Ya ❤️</button>
<button id="no">Tidak 😢</button>

<audio autoplay loop>
<source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>

let yesSize = 1;

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    yesSize += 0.2;
    yesBtn.style.transform = "scale(" + yesSize + ")";
}

function yesClick(){
    document.body.innerHTML =
    "<h1 style='color:white;margin-top:200px;font-size:50px;'>Yeeey ❤️ Anggi sekarang jadi pacarku!</h1>";
}

</script>

</body>
</html>
